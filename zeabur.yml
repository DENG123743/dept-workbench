name: dept-workbench
services:
  - name: dept-workbench
    source:
      type: github
      repo: DENG123743/dept-workbench
      branch: main
    runtime: python3.12
    build:
      command: pip install -r requirements.txt
    start:
      command: gunicorn app:app --bind 0.0.0.0:$PORT
    env:
      SECRET_KEY: dw-prod-secret-2026